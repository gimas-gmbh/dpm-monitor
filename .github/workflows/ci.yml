name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests und Testbuild
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pester und PSScriptAnalyzer installieren
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-PackageProvider NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          Install-Module Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck -Repository PSGallery
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Repository PSGallery

      - name: Tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tools\Invoke-Tests.ps1 -Output Detailed

      - name: Paket bauen
        shell: powershell
        run: .\tools\Build-Release.ps1 -OutDir dist

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Paket bauen
        shell: powershell
        run: .\tools\Build-Release.ps1 -OutDir dist -Tag $env:GITHUB_REF_NAME

      - name: GitHub-Release anlegen
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME @files --verify-tag --title "dpm-monitor $($env:GITHUB_REF_NAME.TrimStart('v'))" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
